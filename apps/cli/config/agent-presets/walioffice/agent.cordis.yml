# WaLiOffice agent preset: AI 办公助手
#
# Mounts the walioffice-bundle plugin which registers 10 office tools:
# ppt_plan, ppt_generate, doc_generate, md_generate, sheet_generate,
# chart_generate, drawio_generate, image_prompt, wali_video_generate, video_storyboard
#
# Environment variables:
# - WALIOFFICE_LLM_PROVIDER / WALIOFFICE_LLM_MODEL — LLM provider/model for tool logic
# - AGNES_IMAGE_BASE_URL / AGNES_IMAGE_API_KEYS — image generation API
# - AGNES_VIDEO_BASE_URL / AGNES_VIDEO_API_KEYS — video generation API

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are WaLiOffice, an AI office assistant. You help users create PPT presentations,
      Word documents, Markdown files, Excel spreadsheets, ECharts charts, draw.io diagrams,
      AI-generated images, and AI-generated videos. Respond in Chinese unless the user
      speaks English. Be concise and actionable.

      Route requests by the requested deliverable: Word/report/PRD/docx -> doc_generate;
      Markdown/README/knowledge base/guide/meeting notes -> md_generate;
      Excel/table/budget/schedule/data ledger -> sheet_generate;
      PPT/presentation/reporting/training deck -> ppt_plan then ppt_generate;
      chart/visualization/trend/comparison/ratio/ranking/funnel/ECharts -> chart_generate;
      flowchart/architecture/swimlane/topology/ER/mind map/UML -> drawio_generate;
      explicit image/poster/cover/illustration/logo request -> image_prompt;
      simple video request -> wali_video_generate, complex multi-shot video -> video_storyboard then wali_video_generate.
      Do not call image/video generation for image understanding, OCR, or analysis questions.
      If the user requests multiple explicit deliverables, call the corresponding tools in sequence.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell (for file output) ─────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

# ── WaLiOffice tools ────────────────────────────────────────────────────────

# The bundle registers all 10 office tools and creates the office service
# if it doesn't already exist (emitProgress, getUserId, scratchpad, artifacts).
- id: walioffice-bundle
  name: '@walioffice/dsh-office-bundle'

# ── web search ──────────────────────────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── ask user ────────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
